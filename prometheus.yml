# prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:

  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"


  - job_name: "lms_microservice"
    static_configs:
      - targets:
          - "localhost:5000"
          - "localhost:5001"
          - "localhost:5002"